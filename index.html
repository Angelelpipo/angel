<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Live Viewer</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #141b2d;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --up: #16a34a;
        --down: #dc2626;
        --border: #243049;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top left, #16213a, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.6rem;
      }

      .panel {
        background: linear-gradient(180deg, #1a243b, var(--card));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1rem;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      }

      .controls {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        align-items: end;
      }

      .field {
        display: grid;
        gap: 0.35rem;
      }

      label {
        color: var(--muted);
        font-size: 0.85rem;
      }

      input, select, button {
        background: #0f172a;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.55rem 0.7rem;
      }

      button {
        cursor: pointer;
        background: #1d4ed8;
        border-color: #1e40af;
      }

      .summary {
        margin-top: 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.8rem;
      }

      .metric {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.75rem;
        background: rgba(15, 23, 42, 0.7);
      }

      .metric .label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .metric .value {
        margin-top: 0.3rem;
        font-size: 1.1rem;
        font-weight: 600;
      }

      #chart {
        width: 100%;
        height: 330px;
        margin-top: 1rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0a1228;
      }

      .up { color: var(--up); }
      .down { color: var(--down); }

      .status {
        margin-top: 0.7rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status strong { color: var(--text); }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Trading Live Viewer</h1>
      <section class="panel">
        <div class="controls">
          <div class="field">
            <label for="symbolInput">Symbol</label>
            <input id="symbolInput" value="BTCUSDT" />
          </div>
          <div class="field">
            <label for="intervalInput">Update</label>
            <select id="intervalInput">
              <option value="1000">1s</option>
              <option value="2000">2s</option>
              <option value="5000">5s</option>
            </select>
          </div>
          <button id="startBtn">Start</button>
          <button id="stopBtn">Stop</button>
        </div>

        <div class="summary">
          <article class="metric">
            <div class="label">Latest Price</div>
            <div class="value" id="latestPrice">-</div>
          </article>
          <article class="metric">
            <div class="label">24h Change</div>
            <div class="value" id="change24">-</div>
          </article>
          <article class="metric">
            <div class="label">Volume (24h)</div>
            <div class="value" id="volume24">-</div>
          </article>
          <article class="metric">
            <div class="label">Last Update</div>
            <div class="value" id="lastUpdate">-</div>
          </article>
        </div>

        <canvas id="chart" width="1000" height="330"></canvas>
        <div class="status" id="statusText"><strong>Status:</strong> stopped</div>
      </section>
    </main>

    <script>
      const state = {
        symbol: "BTCUSDT",
        intervalMs: 1000,
        timer: null,
        prices: [],
        maxPoints: 120,
      };

      const refs = {
        symbolInput: document.getElementById("symbolInput"),
        intervalInput: document.getElementById("intervalInput"),
        startBtn: document.getElementById("startBtn"),
        stopBtn: document.getElementById("stopBtn"),
        latestPrice: document.getElementById("latestPrice"),
        change24: document.getElementById("change24"),
        volume24: document.getElementById("volume24"),
        lastUpdate: document.getElementById("lastUpdate"),
        statusText: document.getElementById("statusText"),
        chart: document.getElementById("chart"),
      };

      const ctx = refs.chart.getContext("2d");

      function setStatus(message) {
        refs.statusText.innerHTML = `<strong>Status:</strong> ${message}`;
      }

      function fmt(value, digits = 2) {
        return Number(value).toLocaleString(undefined, {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits,
        });
      }

      function drawChart() {
        const w = refs.chart.width;
        const h = refs.chart.height;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = "#20304a";
        ctx.lineWidth = 1;
        for (let i = 1; i <= 4; i += 1) {
          const y = (h / 5) * i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        if (state.prices.length < 2) return;

        const min = Math.min(...state.prices);
        const max = Math.max(...state.prices);
        const pad = (max - min) * 0.1 || 1;
        const low = min - pad;
        const high = max + pad;

        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#38bdf8";

        state.prices.forEach((price, i) => {
          const x = (i / (state.prices.length - 1)) * (w - 40) + 20;
          const y = h - ((price - low) / (high - low)) * (h - 40) - 20;
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });

        ctx.stroke();
      }

      function toCoinbaseProduct(symbol) {
        const clean = symbol.replace(/[^A-Z]/g, "");
        if (clean.endsWith("USDT")) return `${clean.slice(0, -4)}-USD`;
        if (clean.endsWith("USD")) return `${clean.slice(0, -3)}-USD`;
        return `${clean}-USD`;
      }

      async function fetchBinanceTicker() {
        const url = `https://api.binance.com/api/v3/ticker/24hr?symbol=${encodeURIComponent(state.symbol)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Binance HTTP ${res.status}`);
        const data = await res.json();
        if (data.code && data.msg) {
          throw new Error(data.msg);
        }

        return {
          source: "Binance",
          lastPrice: Number(data.lastPrice),
          changePct: Number(data.priceChangePercent),
          volume: Number(data.quoteVolume),
        };
      }

      async function fetchCoinbaseTicker() {
        const productId = toCoinbaseProduct(state.symbol);
        const [tickerRes, statsRes] = await Promise.all([
          fetch(`https://api.exchange.coinbase.com/products/${encodeURIComponent(productId)}/ticker`),
          fetch(`https://api.exchange.coinbase.com/products/${encodeURIComponent(productId)}/stats`),
        ]);

        if (!tickerRes.ok) throw new Error(`Coinbase ticker HTTP ${tickerRes.status}`);
        if (!statsRes.ok) throw new Error(`Coinbase stats HTTP ${statsRes.status}`);

        const ticker = await tickerRes.json();
        const stats = await statsRes.json();
        const lastPrice = Number(ticker.price);
        const openPrice = Number(stats.open);
        const changePct = openPrice ? ((lastPrice - openPrice) / openPrice) * 100 : 0;

        return {
          source: `Coinbase (${productId})`,
          lastPrice,
          changePct,
          volume: Number(stats.volume) * lastPrice,
        };
      }

      async function fetchTicker() {
        let quote;
        try {
          quote = await fetchBinanceTicker();
        } catch (binanceError) {
          quote = await fetchCoinbaseTicker();
        }

        state.prices.push(quote.lastPrice);
        if (state.prices.length > state.maxPoints) state.prices.shift();

        refs.latestPrice.textContent = `$${fmt(quote.lastPrice, 2)}`;

        const pct = Number(quote.changePct);
        refs.change24.textContent = `${fmt(pct, 2)}%`;
        refs.change24.className = `value ${pct >= 0 ? "up" : "down"}`;

        refs.volume24.textContent = fmt(quote.volume, 0);
        refs.lastUpdate.textContent = new Date().toLocaleTimeString();

        setStatus(`running (${state.symbol}) via ${quote.source}`);
        drawChart();
      }

      async function tick() {
        try {
          await fetchTicker();
        } catch (err) {
          setStatus(`error: ${err.message}`);
        }
      }

      function start() {
        stop();
        state.symbol = refs.symbolInput.value.trim().toUpperCase() || "BTCUSDT";
        state.intervalMs = Number(refs.intervalInput.value);
        state.prices = [];
        tick();
        state.timer = setInterval(tick, state.intervalMs);
      }

      function stop() {
        if (state.timer) {
          clearInterval(state.timer);
          state.timer = null;
        }
        setStatus("stopped");
      }

      refs.startBtn.addEventListener("click", start);
      refs.stopBtn.addEventListener("click", stop);
      start();
    </script>
  </body>
</html>
